[tools]
node = "lts"
python = "3.14"
uv = "latest"

[tasks."markdown:format"]
description = "Format Markdown files with Prettier"
run = "npx prettier@latest --write \"**/*.md\""

[tasks."markdown:format-check"]
description = "Check Markdown formatting with Prettier"
run = "npx prettier@latest --check \"**/*.md\""

[tasks."python:format"]
description = "Format Python tooling with Ruff"
run = "uvx ruff@latest format analysis"

[tasks."python:format-check"]
description = "Check Python formatting with Ruff"
run = "uvx ruff@latest format --check analysis"

[tasks."python:lint"]
description = "Lint Python tooling with Ruff"
run = "uvx ruff@latest check analysis"

[tasks."python:check"]
description = "Format-check and lint Python tooling"
depends = ["python:format-check", "python:lint"]

[tasks."bin:test"]
description = "Test package selection and test runner behavior"
run = "bin/test-from-upstream-test"

[tasks."dart:format"]
description = "Format Dart sources"
run = "dart format ."

[tasks."dart:format-check"]
description = "Check Dart formatting"
run = "dart format --output=none --set-exit-if-changed ."

[tasks."dart:imports"]
description = "Fix Dart import ordering in each package"
run = """
for package in packages/*/; do
  (cd "$package" && dart run import_order_lint:import_order lib test bin)
done
"""

[tasks."dart:imports-check"]
description = "Check Dart import ordering in each package"
run = """
for package in packages/*/; do
  (cd "$package" && dart run import_order_lint:import_order lib test bin --set-exit-if-changed)
done
"""

[tasks."dart:analyze"]
description = "Analyze Dart sources"
run = "dart analyze --fatal-infos"

[tasks."dart:test"]
description = "Run the package and app tests"
run = "bin/test-from-upstream --all"

[tasks."dart:check"]
description = "Format-check, lint, analyze, and test the Dart packages"
depends = ["dart:format-check", "dart:imports-check", "dart:analyze", "dart:test"]
