[tools]
node = "lts"
python = "3.14"
uv = "latest"

[tasks."markdown:format"]
description = "Format Markdown files with Prettier"
run = "npx prettier@latest --write \"**/*.md\""

[tasks."markdown:format-check"]
description = "Check Markdown formatting with Prettier"
run = "npx prettier@latest --check \"**/*.md\""

[tasks."python:format"]
description = "Format Python tooling with Ruff"
run = "uvx ruff@latest format analysis"

[tasks."python:format-check"]
description = "Check Python formatting with Ruff"
run = "uvx ruff@latest format --check analysis"

[tasks."python:lint"]
description = "Lint Python tooling with Ruff"
run = "uvx ruff@latest check analysis"

[tasks."python:check"]
description = "Format-check and lint Python tooling"
depends = ["python:format-check", "python:lint"]

[tasks."analysis:cold-start-identifiability"]
description = "Pass 5 cold-start identifiability and retrieval-observability characterization"
run = "uv run analysis/learner-model/cold_start_identifiability.py --output-dir analysis/learner-model/generated"

[tasks."analysis:cross-material-placement"]
description = "Pass 6 cross-material placement-memory characterization"
run = "uv run analysis/learner-model/cross_material_placement.py --output-dir analysis/learner-model/generated"

[tasks."analysis:interval-prediction-bridge"]
description = "Pass 7 post-success interval-identifiability bridge characterization"
run = "uv run analysis/learner-model/interval_prediction_bridge.py --output-dir analysis/learner-model/generated"

[tasks."analysis:retained-durability-inference"]
description = "Pass 8 estimator-side retained-durability inference characterization"
run = "uv run analysis/learner-model/retained_durability_inference.py --output-dir analysis/learner-model/generated"

[tasks."analysis:posterior-state-validation"]
description = "Pass 9 retained-consolidation posterior-state validation"
run = "uv run analysis/learner-model/posterior_state_validation.py --output-dir analysis/learner-model/generated"

[tasks."analysis:prior-knowledge-placement"]
description = "Pass 10 prior-knowledge placement-policy characterization"
run = "uv run analysis/learner-model/prior_knowledge_placement.py --output-dir analysis/learner-model/generated"

[tasks."analysis:supported-selection-intent"]
description = "Pass 11 supported-selection intent and cost characterization"
run = "uv run analysis/learner-model/supported_selection_intent.py --output-dir analysis/learner-model/generated"

[tasks."analysis:recovery-modality"]
description = "Pass 12 dimension-targeted recovery modality characterization"
run = "uv run analysis/learner-model/recovery_modality.py --output-dir analysis/learner-model/generated"

[tasks."analysis:guidance-probe-yield"]
description = "Pass 13 guidance-probe marginal-yield and termination characterization"
run = "uv run analysis/learner-model/guidance_probe_yield.py --output-dir analysis/learner-model/generated"

[tasks."analysis:probe-alternative-actions"]
description = "Pass 14 low-yield probe alternative-action characterization"
run = "uv run analysis/learner-model/probe_alternative_actions.py --output-dir analysis/learner-model/generated"

[tasks."analysis:probe-ranking-tradeoff"]
description = "Pass 15 low-yield probe retention-vs-information characterization"
run = "uv run analysis/learner-model/probe_ranking_tradeoff.py --output-dir analysis/learner-model/generated"

[tasks."analysis:probe-completion-need"]
description = "Pass 16 probe-failure completion-need characterization"
run = "uv run analysis/learner-model/probe_completion_need.py --output-dir analysis/learner-model/generated"

[tasks."analysis:recovery-factorial"]
description = "Pass 17 factorial recovery-support characterization"
run = "uv run analysis/learner-model/recovery_factorial.py --output-dir analysis/learner-model/generated"

[tasks."analysis:learner-model"]
description = "Run learner-model simulation invariant checks"
run = "uv run analysis/learner-model/invariants.py"

[tasks."analysis:learner-model-analyze"]
description = "Run learner-model behavioral diagnostics and generate analysis CSVs"
run = "uv run analysis/learner-model/analyze.py --output-dir analysis/learner-model/generated"

[tasks."analysis:reacquisition-experiment"]
description = "Isolated reacquisition experiment (learner-model, diagnostic - not a fix)"
run = "uv run analysis/learner-model/reacquisition_experiment.py --output-dir analysis/learner-model/generated"

[tasks."analysis:latent-memory-design"]
description = "Latent memory state design - activation/durability/consolidation (diagnostic, not a fix)"
run = "uv run analysis/learner-model/latent_memory_design.py --output-dir analysis/learner-model/generated"

[tasks."analysis:consolidation-formation"]
description = "Consolidation formation experiment - which events raise retained durability (diagnostic, not a fix)"
run = "uv run analysis/learner-model/consolidation_formation.py --output-dir analysis/learner-model/generated"

[tasks."analysis:scale-motor"]
description = "Verify scale motor taxonomy and generate analysis artifacts"
run = "uv run analysis/scale-motor/analyze.py --output-dir analysis/scale-motor/generated"

[tasks."analysis:scheduler"]
description = "Run scheduler pipeline boundary/mechanical-correctness checks"
run = "uv run analysis/scheduler/invariants.py"

[tasks."analysis:scheduler-scenarios"]
description = "Run scheduler longitudinal behavioral scenarios (04-v1-scheduler.md §10)"
run = "uv run analysis/scheduler/scenarios.py"

[tasks."analysis:scheduler-sensitivity"]
description = "Run scheduler parameter sensitivity/robustness sweep (Pass 3)"
run = "uv run analysis/scheduler/sensitivity.py --output-dir analysis/scheduler/generated"

[tasks."analysis:scheduler-stress"]
description = "Run scheduler broad stochastic generalization/stress testing (Pass 4)"
run = "uv run analysis/scheduler/stress.py --output-dir analysis/scheduler/generated"
