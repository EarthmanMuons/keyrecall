[tools]
node = "lts"
python = "3.14"
uv = "latest"

[tasks."markdown:format"]
description = "Format Markdown files with Prettier"
run = "npx prettier@latest --write \"**/*.md\""

[tasks."markdown:format-check"]
description = "Check Markdown formatting with Prettier"
run = "npx prettier@latest --check \"**/*.md\""

[tasks."python:format"]
description = "Format Python tooling with Ruff"
run = "uvx ruff@latest format analysis"

[tasks."python:format-check"]
description = "Check Python formatting with Ruff"
run = "uvx ruff@latest format --check analysis"

[tasks."python:lint"]
description = "Lint Python tooling with Ruff"
run = "uvx ruff@latest check analysis"

[tasks."python:check"]
description = "Format-check and lint Python tooling"
depends = ["python:format-check", "python:lint"]
