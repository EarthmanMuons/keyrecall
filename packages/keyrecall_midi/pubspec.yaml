name: keyrecall_midi
description: >-
  MIDI transport for KeyRecall: device discovery, connection lifecycle, and the
  normalized input stream a connected instrument produces.
repository: https://github.com/EarthmanMuons/keyrecall/tree/main/packages/keyrecall_midi
issue_tracker: https://github.com/EarthmanMuons/keyrecall/issues

publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.27.0"

dependencies:
  collection: ^1.19.0
  flutter:
    sdk: flutter
  flutter_midi_command: ^1.0.7
  flutter_midi_command_ble: ^1.0.7
  flutter_riverpod: ^3.0.3
  keyrecall_input: ^0.1.0
  meta: ^1.17.0
  permission_handler: ^13.0.0
  shared_preferences: ^2.5.4

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  import_order_lint: ^0.2.2
  lints: ^6.0.0
