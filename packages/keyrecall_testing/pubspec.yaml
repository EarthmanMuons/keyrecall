name: keyrecall_testing
description: >-
  The property-testing conventions KeyRecall's packages share: one fixed seed,
  a budget scaled on demand, and the small generator combinators they all use.
repository: https://github.com/EarthmanMuons/keyrecall/tree/main/packages/keyrecall_testing
issue_tracker: https://github.com/EarthmanMuons/keyrecall/issues

publish_to: none
version: 0.1.0
resolution: workspace

environment:
  # Library floor: the oldest SDK this package works on. Widen or raise
  # deliberately; the app pins its own toolchain separately.
  sdk: ^3.8.0

dependencies:
  kiri_check: ^1.3.1
  test: ^1.25.0

dev_dependencies:
  import_order_lint: ^0.2.2
  lints: ^6.0.0
