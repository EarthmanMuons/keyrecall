[default]
locale = "en-us"

[files]
# exclude Xcode project and Interface Builder files
extend-exclude = [
  "*.pbxproj",
  "*.xib",
]

# Don't correct these false positives

[type.md]
extend-ignore-re = [
  # "mis-" prefix coinages (e.g. "mis-played"); the checker splits on the hyphen
  # and flags the bare "mis" fragment
  "\\bmis-[a-z]+",
]

[type.storyboard]
extend-glob = ["*.storyboard"]
extend-ignore-re = [
  # Xcode storyboard attribute: autogenerated scene identifiers
  "\\bsceneID\\=\"[^\"]+\"",
]
