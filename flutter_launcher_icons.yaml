# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: "launcher_icon"
  image_path_android: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ff800020" # Burgundy
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "assets/icon/monochrome.png"

  ios: true
  image_path_ios: "assets/icon/icon.png"
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/icon/icon-dark.png"
  image_path_ios_tinted_grayscale: "assets/icon/icon-tinted.png"
  desaturate_tinted_to_grayscale_ios: false
  background_color_ios: "#800020" # Burgundy

  web:
    generate: false

  windows:
    generate: false

  macos:
    generate: false
