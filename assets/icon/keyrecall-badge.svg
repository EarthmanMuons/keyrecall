<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="KeyRecall">
  <defs>
    <clipPath id="kr-badge-clip"><circle cx="24" cy="24" r="22"/></clipPath>
  </defs>
  <circle cx="24" cy="24" r="22" fill="#800020" style="fill:var(--kr-badge,#800020)"/>
  <g clip-path="url(#kr-badge-clip)">
    <g transform="translate(6.474 6.758) scale(0.71828)">
  <title id="krd-title">KeyRecall</title>
  <defs>
    <clipPath id="krd-notKey2">
      <path clip-rule="evenodd" d="M0 0h48v48H0Z M11.92 12.13 A1.35 1.35 0 0 0 10.57 13.48 V39.88 A1.35 1.35 0 0 0 11.92 41.23 H18.85 A1.35 1.35 0 0 0 20.2 39.88 V13.48 A1.35 1.35 0 0 0 18.85 12.13 Z"/>
    </clipPath>
    <clipPath id="krd-notKey3">
      <path clip-rule="evenodd" d="M0 0h48v48H0Z M17.93 9.67 A1.35 1.35 0 0 0 16.58 11.02 V40.03 A1.35 1.35 0 0 0 17.93 41.38 H24.86 A1.35 1.35 0 0 0 26.21 40.03 V11.02 A1.35 1.35 0 0 0 24.86 9.67 Z"/>
    </clipPath>
    <clipPath id="krd-faceBounds">
      <path d="M30.9 6.27 H36.14 V26.63 A.9 .9 0 0 1 35.24 27.53 H31.8 A.9 .9 0 0 1 30.9 26.63 Z"/>
    </clipPath>

    <filter id="krd-lift" x="-60%" y="-60%" width="240%" height="240%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".8" result="b"/>
      <feOffset in="b" dx="-.55" dy=".85" result="o"/>
      <feFlood flood-color="#000000" flood-opacity=".45" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="krd-liftSharp" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".3" result="b"/>
      <feOffset in="b" dx="0" dy=".3" result="o"/>
      <feFlood flood-color="#000000" flood-opacity=".4" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Grey top surface. Stops are spaced to ease rather than ramp: nearly flat
         through the body, accelerating over the last sixth to meet the shell. -->
    <linearGradient id="krd-sharpFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#55555F"/>
      <stop offset=".03" stop-color="#45454F"/>
      <stop offset=".26" stop-color="#3D3D46"/>
      <stop offset=".78" stop-color="#38383F"/>
      <stop offset=".88" stop-color="#303038"/>
      <stop offset=".94" stop-color="#24242C"/>
      <stop offset=".97" stop-color="#17171D"/>
      <stop offset="1"   stop-color="#08080B"/>
    </linearGradient>
    <!-- Specular catch where the top surface rolls into the front face.
         Runs along the stroke, so it fades at the two ends rather than downward. -->
    <linearGradient id="krd-sharpEdge" gradientUnits="userSpaceOnUse" x1="30.9" y1="0" x2="36.14" y2="0">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".07" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset=".93" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Bright, narrow: gone within the top tenth. -->
    <linearGradient id="krd-sharpGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset=".02" stop-color="#FFFFFF" stop-opacity=".11"/>
      <stop offset=".06" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g fill="#FFFFFF" style="fill:var(--kr-key,#FFFFFF)">
    <g filter="url(#krd-lift)"><rect clip-path="url(#krd-notKey2)" opacity=".25" x="5" y="14.74" width="9.63" height="26.28" rx="1.35"/></g>
    <g filter="url(#krd-lift)"><rect clip-path="url(#krd-notKey3)" opacity=".5" x="10.57" y="12.13" width="9.63" height="29.1" rx="1.35"/></g>
    <g filter="url(#krd-lift)"><rect opacity=".75" x="16.58" y="9.67" width="9.63" height="31.71" rx="1.35"/></g>
    <g filter="url(#krd-lift)">
      <rect x="23.24" y="6.27" width="9.63" height="35.47" rx="1.35"/>
      <rect x="34.17" y="6.27" width="9.63" height="35.47" rx="1.35"/>
    </g>
  </g>

  <g filter="url(#krd-liftSharp)">
    <!-- Shell: .42 down the sides, 1.8 across the front face. Square back
         corners so shell, face and both naturals share the y=6.27 top line. -->
    <path fill="#000000" d="M30.48 6.27 H36.56 V28.63 A.7 .7 0 0 1 35.86 29.33 H31.18 A.7 .7 0 0 1 30.48 28.63 Z"/>
    <path fill="url(#krd-sharpFace)" d="M30.9 6.27 H36.14 V26.63 A.9 .9 0 0 1 35.24 27.53 H31.8 A.9 .9 0 0 1 30.9 26.63 Z"/>
    <rect fill="url(#krd-sharpGloss)" clip-path="url(#krd-faceBounds)" x="30.9" y="6.27" width="5.24" height="21.26"/>
    <!-- Traces the face's own bottom contour, inset .30, so it wraps the corners
         at r=.60 instead of running straight off the ends. Wide pass = bloom,
         narrow pass = core. -->
    <g clip-path="url(#krd-faceBounds)" stroke="url(#krd-sharpEdge)" stroke-linecap="round">
      <path fill="none" stroke-width=".34" stroke-opacity=".10" d="M31.2 26.63 A.6 .6 0 0 0 31.8 27.23 H35.24 A.6 .6 0 0 0 35.84 26.63"/>
      <path fill="none" stroke-width=".13" stroke-opacity=".34" d="M31.2 26.63 A.6 .6 0 0 0 31.8 27.23 H35.24 A.6 .6 0 0 0 35.84 26.63"/>
    </g>
  </g>
    </g>
  </g>
</svg>
