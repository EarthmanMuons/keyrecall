name: keyrecall
description: An adaptive practice partner for piano technique.

workspace:
  - packages/keyrecall_alignment
  - packages/keyrecall_domain
  - packages/keyrecall_input
  - packages/keyrecall_input_sources
  - packages/keyrecall_journal
  - packages/keyrecall_midi
  - packages/keyrecall_learner
  - packages/keyrecall_measurement
  - packages/keyrecall_practice
  - packages/keyrecall_scheduler
  - packages/keyrecall_simulation
  - packages/keyrecall_testing

publish_to: none
version: 1.0.0+1

environment:
  # pinned version used for automated testing and releases
  flutter: 3.47.6
  # matching dart version for the above flutter release
  # https://docs.flutter.dev/install/archive#stable-channel
  sdk: ^3.13.5

dependencies:
  crisp_notation: ^0.7.0
  cupertino_icons: ^2.0.0
  fl_chart: ^1.2.0
  flutter_pcm_sound: ^3.3.3
  flutter_riverpod: ^3.0.3
  flutter:
    sdk: flutter
  keyrecall_alignment:
    path: packages/keyrecall_alignment
  keyrecall_domain:
    path: packages/keyrecall_domain
  keyrecall_input:
    path: packages/keyrecall_input
  keyrecall_input_sources:
    path: packages/keyrecall_input_sources
  keyrecall_journal:
    path: packages/keyrecall_journal
  keyrecall_measurement:
    path: packages/keyrecall_measurement
  keyrecall_midi:
    path: packages/keyrecall_midi
  keyrecall_learner:
    path: packages/keyrecall_learner
  keyrecall_practice:
    path: packages/keyrecall_practice
  keyrecall_scheduler:
    path: packages/keyrecall_scheduler
  keyrecall_simulation:
    path: packages/keyrecall_simulation
  material_ui: ^1.1.0
  package_info_plus: ^10.0.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4
  wakelock_plus: ^1.8.0
  clock: ^1.1.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  import_order_lint: ^0.2.2

flutter:
  uses-material-design: true

  assets:
    - assets/icon/keyrecall-badge.webp

  fonts:
    - family: KeyRecall Symbols
      fonts:
        - asset: assets/fonts/KeyRecallSymbols-Regular.otf
        - asset: assets/fonts/KeyRecallSymbols-Bold.otf
          weight: 700
