name: keyrecall
description: An adaptive piano technical-practice scheduler.

workspace:
  - packages/keyrecall_domain
  - packages/keyrecall_input
  - packages/keyrecall_input_sources
  - packages/keyrecall_journal
  - packages/keyrecall_midi
  - packages/keyrecall_learner
  - packages/keyrecall_practice
  - packages/keyrecall_scheduler
  - packages/keyrecall_simulation

publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.0.3
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5

  keyrecall_domain:
    path: packages/keyrecall_domain
  keyrecall_input:
    path: packages/keyrecall_input
  keyrecall_input_sources:
    path: packages/keyrecall_input_sources
  keyrecall_journal:
    path: packages/keyrecall_journal
  keyrecall_midi:
    path: packages/keyrecall_midi
  keyrecall_learner:
    path: packages/keyrecall_learner
  keyrecall_practice:
    path: packages/keyrecall_practice
  keyrecall_scheduler:
    path: packages/keyrecall_scheduler
  keyrecall_simulation:
    path: packages/keyrecall_simulation

dev_dependencies:
  flutter_launcher_icons: "^0.14.4"
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
